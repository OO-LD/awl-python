name: Feature request
description: Propose a new building block, profile or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or cumbersome today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should the template do instead? Core, profile or opt-in?
    validations:
      required: true
