[project]
site_name = "awl-python"
repo_url = "https://github.com/OO-LD/awl-python"
site_url = "https://OO-LD.github.io/awl-python/"
site_description = "Python implementation of the Abstract Workflow Language (AWL-LD)"
site_author = "OO-LD Contributors"
edit_uri = "edit/main/docs/"
repo_name = "OO-LD/awl-python"
copyright = 'Maintained by <a href="https://github.com/OO-LD">OO-LD</a>.'

nav = [
    { "Home" = "index.md" },
    { "Worked examples" = "examples.md" },
    { "API Reference" = "awl.md" },
    { "Development" = "dev.md" },
]

[project.plugins.macros]
# The worked-examples page is built from the corpus at render time.
module_name = "docs/macros"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src/awl"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "numpy"

[project.theme]
language = "en"
# Logo/favicon referenced directly from the OO-LD org so they stay in sync
# with the source of truth (no vendored copy to maintain).
logo = "https://raw.githubusercontent.com/OO-LD/schema/main/OO-LD_logo.jpg"
favicon = "https://raw.githubusercontent.com/OO-LD/schema/main/OO-LD_logo.jpg"
features = [
    "content.action.edit",
    "content.code.annotate",
    "content.code.copy",
    "navigation.footer",
    "navigation.indexes",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "white"
accent = "deep orange"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "deep orange"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/OO-LD/awl-python"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/awl"

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.pymdownx.superfences]

# Design docs use mermaid diagrams.
[[project.markdown_extensions.pymdownx.superfences.custom_fences]]
name = "mermaid"
class = "mermaid"
format = "pymdownx.superfences.fence_code_format"

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true

[project.markdown_extensions.toc]
permalink = true
